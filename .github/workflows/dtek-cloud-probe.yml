name: DTEK cloud connectivity probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DTEK client
        run: python -m pip install --disable-pip-version-check "dtek-blackout-client==0.2.1"

      - name: Test standard HTTP access and address data
        run: |
          python - <<'PY'
          import asyncio
          from dtek_client import DtekClient

          CITY = "м. Київ"

          async def main():
              print("Probe: DTEK Kyiv City (kem)")
              async with DtekClient("kem", retry_attempts=1) as client:
                  streets = await client.get_streets()
                  print(f"HTTP/API: getStreets OK; streets returned: {len(streets)}")
                  matches = [s.name for s in streets if "заболот" in s.name.casefold()]
                  print(f"Matching street names: {matches[:10]}")
                  if not matches:
                      raise RuntimeError("Akademika Zabolotnoho street was not found in DTEK directory")
                  street = next((s.name for s in streets if "заболот" in s.name.casefold() and "академіка" in s.name.casefold()), matches[0])
                  print(f"Using canonical DTEK street name: {street}")
                  response = await client.get_home_num(CITY, street)
                  print(f"HTTP/API: getHomeNum OK; house records: {len(response.houses)}")
                  for number in ("56", "58"):
                      entry = response.find_house(number)
                      if entry is None:
                          print(f"House {number}: NOT FOUND")
                          continue
                      print(
                          f"House {number}: groups={entry.group_ids}; "
                          f"sub_type={entry.sub_type!r}; "
                          f"start={entry.start_date!r}; end={entry.end_date!r}; "
                          f"type={entry.outage_type!r}"
                      )
                  a, b = response.find_house("56"), response.find_house("58")
                  if a is not None and b is not None:
                      same = (
                          a.group_ids == b.group_ids
                          and a.sub_type == b.sub_type
                          and a.start_date == b.start_date
                          and a.end_date == b.end_date
                          and a.outage_type == b.outage_type
                      )
                      print(f"House 56/58 address data identical: {same}")
                  print("RESULT: PASS — standard HTTP API access succeeded")
          try:
              asyncio.run(main())
          except Exception as exc:
              # Exception messages may contain URLs or response fragments; keep logs concise.
              print(f"RESULT: FAIL — {type(exc).__name__}: {str(exc)[:300]}")
              raise
          PY
